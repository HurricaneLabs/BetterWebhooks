[lint]
# Pin the rule set explicitly. Ruff's defaults change between releases, and
# only CI pins the ruff version, so relying on them lets a local run and CI
# disagree. E4/E7/E9/F is ruff's older default set; BWH-V2-4 widened it with
# the families ruff 0.16 started flagging here. Of TRY, only TRY002 is on:
# TRY400 would push toward logger.exception(), which writes the traceback
# outside the message, where log redaction can't scrub it.
select = ["E4", "E7", "E9", "F", "I", "UP", "FA", "B", "BLE", "TRY002", "RUF"]

# E402: module-level import not at top of file
# Splunk bin scripts use sys.path.insert() after initial imports, which is unavoidable.
ignore = ["E402"]
