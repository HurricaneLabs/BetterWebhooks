# Vendored third-party code (loguru): not ours to lint, so a bare `ruff check`
# from the repo root covers only our own Python.
extend-exclude = ["packages/better-webhooks/src/main/resources/splunk/lib"]

[lint]
# List the rule families explicitly: ruff's default set changes between
# releases. The families (RUF, B, UP, ...) still take in new rules when ruff is
# upgraded, so the pin in ci.yml (ruff==0.16.7) decides when new rules arrive,
# and a newer local ruff can flag rules CI doesn't run yet.
# E4/E7/E9/F is ruff's older default set; BWH-V2-4 widened it with
# the families ruff 0.16 started flagging here. Of TRY, only TRY002 is on:
# TRY400 would push toward logger.exception(), which writes the traceback
# outside the message, where log redaction can't scrub it.
select = ["E4", "E7", "E9", "F", "I", "UP", "FA", "B", "BLE", "TRY002", "RUF"]

# E402: module-level import not at top of file
# Splunk bin scripts use sys.path.insert() after initial imports, which is unavoidable.
ignore = ["E402"]
