[better_webhook]
# Splunk 10.2+ uses python.required over python.version; older Splunk doesn't
# know python.required. Keep both: AppInspect still fails a missing python.version.
python.version = python3
python.required = 3.13
is_custom = 1
label = Better Webhook
description = Generic HTTP POST to a specified URL
payload_format = json
icon_path = bw.png
param.user_agent = Splunk/$server.guid$
param.url =
param.body_format = {\
  "sid": $$sid$$,\
  "search_name": $$search_name$$,\
  "app": $$app$$,\
  "owner": $$owner$$,\
  "results_link": $$results_link$$,\
  "result": $$full_result$$\
}
param.credential =
param.body_failure_regex =
