name: Build BetterWebhooks.spl

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    # published, not created: created never fires for a draft, and publishing
    # a draft later fires only published.
    types: [ published ]

# Read-only by default; only the release job can write (to attach the .spl).
permissions:
  contents: read

# Same as ci.yml, and each release run also gets a group of its own, so a
# release upload is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build BetterWebhooks.spl
      run: yarn run package

    - name: Upload BetterWebhooks.spl artifact
      uses: actions/upload-artifact@v4
      with:
        name: BetterWebhooks-spl
        path: BetterWebhooks.spl
        retention-days: 30

    - name: Verify artifact
      run: |
        echo "Verifying BetterWebhooks.spl was created..."
        ls -la BetterWebhooks.spl
        echo "Archive contents:"
        tar -tzf BetterWebhooks.spl | head -20

  # Attach the build job's .spl to the release (only on release events).
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download BetterWebhooks.spl from the build job
      uses: actions/download-artifact@v4
      with:
        name: BetterWebhooks-spl

    - name: Attach BetterWebhooks.spl to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" BetterWebhooks.spl --repo "$GITHUB_REPOSITORY" --clobber
